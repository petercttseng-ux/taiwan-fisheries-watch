name: Refresh and deploy fisheries dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          package-manager-cache: false

      - name: Search latest fisheries news and build static dashboard
        run: npm run refresh:static

      - name: Publish latest snapshot for the Sites fallback
        run: node --input-type=module -e "import fs from 'node:fs'; const artifact = JSON.parse(fs.readFileSync('work/latest-artifact.json', 'utf8')); fs.writeFileSync('docs/snapshot.json', JSON.stringify(artifact.snapshot));"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

